<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create your RepoAuditor account to start running AI-powered repository audits." />
    <title>Sign Up — RepoAuditor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page">

    <!-- ===== Top Bar ===== -->
    <header class="topbar">
      <a href="index.html" class="brand">RepoAuditor</a>
      <nav class="nav-links">
        <a href="index.html#features">Features</a>
        <a href="index.html#pricing">Pricing</a>
      </nav>
      <a href="login.html" class="button button-secondary">Log In</a>
    </header>

    <!-- ===== Signup Card ===== -->
    <main class="auth-main">
      <div class="auth-card">
        <div class="auth-card-header">
          <h1>Create your account</h1>
          <p>Start auditing repositories in seconds — no credit card required.</p>
        </div>

        <form id="signupForm" class="auth-form" novalidate>
          <div class="field-group">
            <label for="signupName">Full Name</label>
            <input type="text" id="signupName" placeholder="Jane Doe" required autocomplete="name" />
          </div>

          <div class="field-group">
            <label for="signupEmail">Email Address</label>
            <input type="email" id="signupEmail" placeholder="you@example.com" required autocomplete="email" />
          </div>

          <div class="field-group">
            <label for="signupPassword">Password</label>
            <input type="password" id="signupPassword" placeholder="Min. 8 characters" required minlength="8" autocomplete="new-password" />
          </div>

          <div class="field-group">
            <label for="signupConfirm">Confirm Password</label>
            <input type="password" id="signupConfirm" placeholder="Re-enter your password" required minlength="8" autocomplete="new-password" />
          </div>

          <p id="signupMessage" class="form-message"></p>

          <button type="submit" id="signupSubmit" class="button button-primary">Create Account</button>
        </form>

        <p class="auth-footer-link">
          Already have an account? <a href="login.html">Log in</a>
        </p>
      </div>
    </main>

    <!-- ===== Footer ===== -->
    <footer class="footer">
      <div>© 2026 RepoAuditor. Built for audit teams and engineering leaders.</div>
      <div>support@repoauditor.example</div>
    </footer>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
      (function () {
        'use strict';

        // If already logged in, redirect to home
        if (window.AppAuth.isLoggedIn()) {
          window.location.href = 'index.html';
          return;
        }

        var form = document.getElementById('signupForm');
        var msg = document.getElementById('signupMessage');
        var submitBtn = document.getElementById('signupSubmit');

        form.addEventListener('submit', async function (e) {
          e.preventDefault();

          var name = document.getElementById('signupName').value.trim();
          var email = document.getElementById('signupEmail').value.trim();
          var password = document.getElementById('signupPassword').value;
          var confirm = document.getElementById('signupConfirm').value;

          // Reset message
          msg.textContent = '';
          msg.className = 'form-message';

          // Validation
          if (!name) {
            showError('Please enter your full name.');
            return;
          }
          if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            showError('Please enter a valid email address.');
            return;
          }
          if (password.length < 8) {
            showError('Password must be at least 8 characters.');
            return;
          }
          if (password !== confirm) {
            showError('Passwords do not match.');
            return;
          }

          // Disable button
          submitBtn.disabled = true;
          submitBtn.textContent = 'Creating account…';

          var result = await window.AppAuth.register(name, email, password);

          if (result.success) {
            msg.textContent = result.message + ' Redirecting…';
            msg.className = 'form-message form-message-success';
            setTimeout(function () {
              window.location.href = 'index.html';
            }, 800);
          } else {
            showError(result.message);
            submitBtn.disabled = false;
            submitBtn.textContent = 'Create Account';
          }
        });

        function showError(text) {
          msg.textContent = text;
          msg.className = 'form-message form-message-error';
        }
      })();
    </script>

  </body>
</html>
