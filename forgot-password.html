<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Reset your RepoAuditor account password." />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <title>Forgot Password — RepoAuditor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page">

    <!-- ===== Top Bar ===== -->
    <header class="topbar">
      <a href="index.html" class="brand">RepoAuditor</a>
      <nav class="nav-links">
        <a href="index.html#features">Features</a>
        <a href="index.html#pricing">Pricing</a>
      </nav>
      <a href="login.html" class="button button-secondary">Log In</a>
    </header>

    <!-- ===== Forgot Password Card ===== -->
    <main class="auth-main">
      <div class="auth-card">
        <div class="auth-card-header">
          <h1>Forgot your password?</h1>
          <p>Enter your email and we'll send you a link to reset it.</p>
        </div>

        <form id="forgotForm" class="auth-form" novalidate>
          <div class="field-group">
            <label for="forgotEmail">Email Address</label>
            <input type="email" id="forgotEmail" placeholder="you@example.com" required autocomplete="email" />
          </div>

          <p id="forgotMessage" class="form-message"></p>

          <button type="submit" id="forgotSubmit" class="button button-primary">Send Reset Link</button>
        </form>

        <p class="auth-footer-link">
          Remember your password? <a href="login.html">Log in</a>
        </p>
      </div>
    </main>

    <!-- ===== Footer ===== -->
    <footer class="footer">
      <div>© 2026 RepoAuditor. Built for audit teams and engineering leaders.</div>
      <div><a href="mailto:kush17112004@gmail.com">kush17112004@gmail.com</a> | <a href="tel:+918840381375">+91 88403 81375</a></div>
    </footer>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
      (function () {
        'use strict';

        var form = document.getElementById('forgotForm');
        var msg = document.getElementById('forgotMessage');
        var submitBtn = document.getElementById('forgotSubmit');

        form.addEventListener('submit', async function (e) {
          e.preventDefault();

          var email = document.getElementById('forgotEmail').value.trim();

          msg.textContent = '';
          msg.className = 'form-message';

          if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            showError('Please enter a valid email address.');
            return;
          }

          submitBtn.disabled = true;
          submitBtn.textContent = 'Sending…';

          var result = await window.AppAuth.forgotPassword(email);

          if (result.success) {
            msg.textContent = result.message;
            msg.className = 'form-message form-message-success';
            submitBtn.textContent = 'Link Sent ✓';
          } else {
            showError(result.message);
            submitBtn.disabled = false;
            submitBtn.textContent = 'Send Reset Link';
          }
        });

        function showError(text) {
          msg.textContent = text;
          msg.className = 'form-message form-message-error';
        }
      })();
    </script>

  </body>
</html>
