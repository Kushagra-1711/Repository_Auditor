<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Set a new password for your RepoAuditor account." />
    <title>Reset Password — RepoAuditor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page">

    <!-- ===== Top Bar ===== -->
    <header class="topbar">
      <a href="index.html" class="brand">RepoAuditor</a>
      <nav class="nav-links">
        <a href="index.html#features">Features</a>
        <a href="index.html#pricing">Pricing</a>
      </nav>
      <a href="login.html" class="button button-secondary">Log In</a>
    </header>

    <!-- ===== Reset Password Card ===== -->
    <main class="auth-main">
      <div class="auth-card">
        <div class="auth-card-header">
          <h1>Reset your password</h1>
          <p>Choose a new password for your account.</p>
        </div>

        <form id="resetForm" class="auth-form" novalidate>
          <div class="field-group">
            <label for="resetPassword">New Password</label>
            <input type="password" id="resetPassword" placeholder="Min. 8 characters" required minlength="8" autocomplete="new-password" />
          </div>

          <div class="field-group">
            <label for="resetConfirm">Confirm Password</label>
            <input type="password" id="resetConfirm" placeholder="Re-enter your password" required minlength="8" autocomplete="new-password" />
          </div>

          <p id="resetMessage" class="form-message"></p>

          <button type="submit" id="resetSubmit" class="button button-primary">Reset Password</button>
        </form>

        <p class="auth-footer-link">
          <a href="login.html">Back to Log In</a>
        </p>
      </div>
    </main>

    <!-- ===== Footer ===== -->
    <footer class="footer">
      <div>© 2026 RepoAuditor. Built for audit teams and engineering leaders.</div>
      <div><a href="mailto:kush17112004@gmail.com">kush17112004@gmail.com</a> | <a href="tel:+918840381375">+91 88403 81375</a></div>
    </footer>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
      (function () {
        'use strict';

        var form = document.getElementById('resetForm');
        var msg = document.getElementById('resetMessage');
        var submitBtn = document.getElementById('resetSubmit');

        // Extract token from URL query string
        var params = new URLSearchParams(window.location.search);
        var token = params.get('token');

        if (!token) {
          msg.textContent = 'Invalid or missing reset link. Please request a new one.';
          msg.className = 'form-message form-message-error';
          submitBtn.disabled = true;
        }

        form.addEventListener('submit', async function (e) {
          e.preventDefault();

          var password = document.getElementById('resetPassword').value;
          var confirm = document.getElementById('resetConfirm').value;

          msg.textContent = '';
          msg.className = 'form-message';

          if (password.length < 8) {
            showError('Password must be at least 8 characters.');
            return;
          }
          if (password !== confirm) {
            showError('Passwords do not match.');
            return;
          }

          submitBtn.disabled = true;
          submitBtn.textContent = 'Resetting…';

          var result = await window.AppAuth.resetPassword(token, password);

          if (result.success) {
            msg.textContent = result.message + ' Redirecting to login…';
            msg.className = 'form-message form-message-success';
            setTimeout(function () {
              window.location.href = 'login.html';
            }, 1500);
          } else {
            showError(result.message);
            submitBtn.disabled = false;
            submitBtn.textContent = 'Reset Password';
          }
        });

        function showError(text) {
          msg.textContent = text;
          msg.className = 'form-message form-message-error';
        }
      })();
    </script>

  </body>
</html>
