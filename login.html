<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Log in to your RepoAuditor account to manage audits and view reports." />
    <title>Log In — RepoAuditor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page">

    <!-- ===== Top Bar ===== -->
    <header class="topbar">
      <a href="index.html" class="brand">RepoAuditor</a>
      <nav class="nav-links">
        <a href="index.html#features">Features</a>
        <a href="index.html#pricing">Pricing</a>
      </nav>
      <a href="signup.html" class="button button-primary">Sign Up Free</a>
    </header>

    <!-- ===== Login Card ===== -->
    <main class="auth-main">
      <div class="auth-card">
        <div class="auth-card-header">
          <h1>Welcome back</h1>
          <p>Log in to access your audit dashboard and reports.</p>
        </div>

        <form id="loginForm" class="auth-form" novalidate>
          <div class="field-group">
            <label for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail" placeholder="you@example.com" required autocomplete="email" />
          </div>

          <div class="field-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password" />
          </div>

          <p id="loginMessage" class="form-message"></p>

          <button type="submit" id="loginSubmit" class="button button-primary">Log In</button>
        </form>

        <p class="auth-footer-link">
          <a href="forgot-password.html">Forgot your password?</a>
        </p>
        <p class="auth-footer-link">
          Don't have an account? <a href="signup.html">Sign up for free</a>
        </p>
      </div>
    </main>

    <!-- ===== Footer ===== -->
    <footer class="footer">
      <div>© 2026 RepoAuditor. Built for audit teams and engineering leaders.</div>
      <div>support@repoauditor.example</div>
    </footer>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
      (function () {
        'use strict';

        // If already logged in, redirect to home
        if (window.AppAuth.isLoggedIn()) {
          window.location.href = 'index.html';
          return;
        }

        var form = document.getElementById('loginForm');
        var msg = document.getElementById('loginMessage');
        var submitBtn = document.getElementById('loginSubmit');

        form.addEventListener('submit', async function (e) {
          e.preventDefault();

          var email = document.getElementById('loginEmail').value.trim();
          var password = document.getElementById('loginPassword').value;

          // Reset message
          msg.textContent = '';
          msg.className = 'form-message';

          // Validation
          if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            showError('Please enter a valid email address.');
            return;
          }
          if (!password) {
            showError('Please enter your password.');
            return;
          }

          // Disable button
          submitBtn.disabled = true;
          submitBtn.textContent = 'Logging in…';

          var result = await window.AppAuth.login(email, password);

          if (result.success) {
            msg.textContent = result.message + ' Redirecting…';
            msg.className = 'form-message form-message-success';
            setTimeout(function () {
              window.location.href = 'index.html';
            }, 600);
          } else {
            showError(result.message);
            submitBtn.disabled = false;
            submitBtn.textContent = 'Log In';
          }
        });

        function showError(text) {
          msg.textContent = text;
          msg.className = 'form-message form-message-error';
        }
      })();
    </script>

  </body>
</html>
